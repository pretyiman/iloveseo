name: "SEO Repair Kit Audit"
description: "Run an SEO Repair Kit audit against a project and fail the build if findings at or above a given severity are found."
inputs:
  api-key:
    description: "SEO Repair Kit API key (srk_live_...). Pass via a repository secret."
    required: true
  project-id:
    description: "The SEO Repair Kit project id to audit."
    required: true
  api-url:
    description: "API base URL. Defaults to http://localhost:8000 -- override once a hosted instance exists."
    required: false
  fail-on:
    description: "Fail the build if any finding at or above this severity exists (critical, high, medium, low, info). Omit to never fail on findings."
    required: false
  timeout:
    description: "Max seconds to wait for the audit to complete."
    required: false
    default: "300"
runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install and build seokit CLI
      shell: bash
      working-directory: ${{ github.action_path }}/../../../apps/cli
      run: |
        npm ci
        npm run build

    - name: Run audit
      shell: bash
      working-directory: ${{ github.action_path }}/../../../apps/cli
      env:
        SRK_API_KEY: ${{ inputs.api-key }}
        SRK_API_URL: ${{ inputs.api-url }}
      run: |
        ARGS=(audit run --project-id "${{ inputs.project-id }}" --wait --timeout "${{ inputs.timeout }}")
        if [ -n "${{ inputs.fail-on }}" ]; then
          ARGS+=(--fail-on "${{ inputs.fail-on }}")
        fi
        node dist/src/cli.js "${ARGS[@]}"
